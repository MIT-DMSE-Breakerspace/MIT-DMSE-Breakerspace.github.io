<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <title>{{ page.title }} | {{ site.title }}</title>
  </head>
  <body>
    <main>
      <h1>{{ page.title }}</h1>
      <p>This page has moved to <a href="{{ page.redirect_to | relative_url }}">{{ page.link_label | default: page.title }}</a>.</p>
    </main>
  </body>
</html>
