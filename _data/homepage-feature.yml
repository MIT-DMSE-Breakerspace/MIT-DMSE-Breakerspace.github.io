question: What makes a diamond sharpening stone abrasive?
summary: To the eye, the surface looks uniformly rough. Under reflected-light microscopy, it resolves into sharp, angular diamond grains electroplated into a nickel matrix. Moving between these views connects an everyday tool to the material structure that gives it its function.
