title: DMSE Breakerspace
logo: /assets/img/logo.svg
description: The MIT DMSE Breakerspace is a materials exploration lab open to all undergraduates.
show_downloads: false
google_analytics:
theme: jekyll-theme-minimal
collections:
  samples:
    output: true
    permalink: /sample-library/:name/
  staff-training:
    output: true
    permalink: /trainer/:name/
defaults:
  - scope:
      path: ""
      type: staff-training
    values:
      layout: trainer
      trainer_portal: true
      sitemap: false
exclude:
  - README.md
  - CLAUDE.md
  - _admin
  - assets/survey
  - assets/tools
  - assets/img/image-contest
  - handouts
  - image-contest.md
  - image-contest-archive.md
  - showcases/README.md
  - showcases/_template.md
